<style>
:root{--yellow:#FFD90E;--black:#050505;--white:#fff;--navy:#102A4A;--purple:#5A155F;--cyan:#20C7D9;--ink:#081426;--border:rgba(255,255,255,.18);--soft:#b9c6da;--display:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",Arial,sans-serif}
*{box-sizing:border-box}html,body,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{height:100%}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--ink);color:#fff;height:100vh;height:100dvh;height:var(--app-h,100dvh);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}.app{height:100%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);min-width:0}
.top{height:calc(clamp(44px,7vh,64px) + env(safe-area-inset-top,0px) + 3px);min-width:0;background:linear-gradient(90deg,var(--navy),#2b1050);color:white;display:flex;align-items:center;padding:env(safe-area-inset-top,0px) clamp(10px,2vw,18px) 0;gap:12px;flex-shrink:0;border-bottom:3px solid var(--yellow)}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(18px,3.4vh,28px);letter-spacing:1px;white-space:nowrap;display:flex;align-items:center;gap:8px}.logo span{color:var(--yellow)}
.lgimg{height:clamp(34px,6vh,54px);width:auto;display:block;flex-shrink:0}
.qmark{display:inline-flex;align-items:center;justify-content:center;width:1.3em;height:1.3em;border-radius:50%;background:var(--yellow);color:var(--ink);font-weight:400;font-size:.85em;transform:rotate(-8deg)}
.quiz-title{font-weight:700;opacity:.9;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tbtns{display:flex;gap:8px;flex-shrink:0}.ic{display:none}.ic svg{width:1.1em;height:1.1em;display:block}
.top button{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);color:#fff;border:1px solid var(--border);border-radius:9px;padding:clamp(6px,1.2vh,10px) 12px;font-weight:800;font-size:clamp(12px,2vh,15px)}.top button:hover{border-color:var(--yellow)}.top button.hot{background:var(--yellow);color:var(--black);border-color:var(--yellow)}
.main{display:grid;grid-template-columns:clamp(150px,18vw,230px) minmax(0,1fr);min-height:0;flex:1;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(32,199,217,.22),transparent 70%),repeating-conic-gradient(from 0deg at 50% -25%,rgba(255,255,255,.035) 0 5deg,transparent 5deg 10deg),linear-gradient(180deg,#0d2547,#12072a)}
.sidebar{background:rgba(6,14,30,.6);border-right:1px solid var(--border);overflow:auto;padding:12px}
.side-title{font-weight:900;font-size:12px;color:var(--cyan);text-transform:uppercase;margin:10px 6px 8px}

/* ===== polish layer ===== */
:root{--gold1:#ffe95a;--gold2:#FFD90E;--gold3:#e0b800}
/* question card: gold edge, inner glow, slow light sweep */
.card{box-shadow:0 0 0 3px var(--ink),0 0 0 5px rgba(255,217,14,.5),0 0 14px rgba(255,217,14,.22),0 16px 44px rgba(0,0,0,.55),inset 0 0 70px rgba(255,217,14,.05)}
.card>*{position:relative;z-index:1}
.card::after{content:'';position:absolute;top:0;bottom:0;left:0;width:45%;z-index:0;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);transform:translateX(-120%) skewX(-12deg);animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-120%) skewX(-12deg)}100%{transform:translateX(320%) skewX(-12deg)}}
.pill.points{background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold3));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.18),0 2px 0 #b39500}
.qnum{position:relative;transition:transform .12s,background .15s}
.qnum:active{transform:scale(.94)}
.qnum.active{box-shadow:inset 0 0 12px rgba(255,255,255,.55),0 2px 0 #b39500}
.qnum.done::after{content:'\2713';position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--cyan);color:var(--ink);font:900 8px/12px Arial,sans-serif;text-align:center}
/* answer reveal */
.answer-box.pop .answer{animation:aflash .8s ease-out}
.answer-box.pop .info{animation:infoin .6s .25s both}
@keyframes aflash{0%{text-shadow:0 0 0 rgba(255,217,14,0);filter:brightness(1)}30%{text-shadow:0 0 26px rgba(255,217,14,.9);filter:brightness(1.35)}100%{text-shadow:0 0 0 rgba(255,217,14,0);filter:brightness(1)}}
@keyframes infoin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* arcade buttons */
.control{transition:transform .08s,filter .15s,border-color .15s;white-space:nowrap}
.control:hover:not(:disabled){filter:brightness(1.12)}
.control:active:not(:disabled){transform:translateY(2px) scale(.985)}
.reveal{background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold3));box-shadow:0 4px 0 #8f7600,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.reveal:active{box-shadow:0 1px 0 #8f7600,0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.primary{background:linear-gradient(180deg,#58e6f4,var(--cyan) 55%,#12a3b3);box-shadow:0 4px 0 #0c7783,0 6px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.primary:active{box-shadow:0 1px 0 #0c7783,0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.control:disabled{opacity:.3;filter:saturate(.3);box-shadow:none;transform:none}
.control kbd{font:inherit;font-size:.7em;font-weight:800;margin-left:.55em;padding:.1em .45em;border:1px solid currentColor;border-radius:5px;opacity:.65;vertical-align:.1em}
@media(max-width:900px),(max-height:560px){.control kbd{display:none}}
/* top bar shimmer */
.top{position:relative}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:3px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent) -100% 0/35% 100% no-repeat;animation:shim 7s linear infinite}
@keyframes shim{to{background-position:200% 0}}
/* sidebar progress + active accent */
.round-btn{position:relative;transition:border-color .15s,background .15s}
.round-btn.active{box-shadow:inset 5px 0 0 var(--ink)}
.rbar{display:block;height:4px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:6px;overflow:hidden}
.rbar b{display:block;height:100%;background:var(--cyan);border-radius:3px;transition:width .4s}

@media(max-width:800px),(max-height:520px){.rbar{display:none}.round-btn.active{box-shadow:none}}
/* contents screen */
.board{isolation:isolate;overflow:hidden}
.board::after{content:'';position:absolute;inset:0;z-index:-1;border-radius:18px;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 38%,rgba(255,217,14,.085) 0 3deg,transparent 3deg 10deg);-webkit-mask-image:radial-gradient(ellipse at 50% 38%,#000 0,transparent 75%);mask-image:radial-gradient(ellipse at 50% 38%,#000 0,transparent 75%);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.board h1{text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 34px rgba(255,217,14,.35)}

@keyframes gopulse{0%,100%{box-shadow:0 5px 0 #b39500,0 0 0 0 rgba(255,217,14,.55)}60%{box-shadow:0 5px 0 #b39500,0 0 0 16px rgba(255,217,14,0)}}
.rcard{position:relative;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s}
@media(hover:hover){.rcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.35),0 0 0 1px rgba(255,217,14,.4)}}
.rcard .rp{grid-column:1/-1;grid-row:2;display:flex;align-items:center;gap:10px;margin-top:2px}
.rp i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}

/* round grid */
.gbtn{position:relative;transition:transform .12s,border-color .15s,box-shadow .15s,background .15s}
@media(hover:hover){.gbtn:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 22px rgba(255,217,14,.35)}}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}

/* screen / question transitions (only when the screen or question changes) */
@keyframes cardin{from{opacity:0;transform:translateY(10px) scale(.992)}to{opacity:1;transform:none}}

.schip.on{background:var(--yellow);color:var(--black);border-color:#d4b800}.schip.has::after{content:' \2713'}
.cov{background:rgba(32,199,217,.25);color:#bff3f8}
.tcl{display:inline-flex;align-items:center;gap:8px;font-weight:900;color:var(--cyan);text-transform:uppercase;font-size:12px;margin-left:8px}
.tcl input,.sin{background:#fff;color:var(--black);border:2px solid transparent;border-radius:8px;font:900 20px Arial,sans-serif;text-align:center;padding:6px 4px}
.tcl input{width:4.4em;font-size:16px}.sin{width:4.6em}.sin:focus,.tcl input:focus{outline:0;border-color:var(--cyan)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:8px}
.srow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:12px;padding:7px 12px}
.sn{font-weight:900;width:5.2em;white-space:nowrap}.stot{margin-left:auto;font-weight:900;font-size:20px;color:var(--yellow)}
.srank{min-width:3.2em;text-align:center;font-weight:900;font-size:13px;border-radius:999px;padding:4px 8px;background:rgba(255,255,255,.12)}.srank:empty{visibility:hidden}
.srank.r1{background:#FFD90E;color:#050505}.srank.r2{background:#d9dfe8;color:#050505}.srank.r3{background:#cd7f32;color:#050505}
.sbl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px;text-align:left;margin:4px 0}
.sbli{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:10px;padding:6px 12px;font-weight:900}
.sbli b{width:1.8em;color:var(--cyan)}.sbli span{flex:1}.sbli em{font-style:normal;color:var(--yellow)}
.sbli.win{background:linear-gradient(90deg,#ffe95a,#FFD90E);color:#050505;box-shadow:0 0 18px rgba(255,217,14,.5)}.sbli.win b,.sbli.win em{color:#050505}
.sc{flex:1 1 auto;min-height:0}
.sgrid{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--r),minmax(0,1fr));grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:4px 12px;max-height:calc(var(--r)*60px)}
.srow{padding:0 12px;min-height:0;overflow:hidden;gap:8px}
.sin{align-self:stretch;height:auto;min-height:0;padding:0;border-radius:6px;font-size:clamp(11px,2.5vh,20px)}
.sn{font-size:clamp(11px,2.3vh,16px)}.stot{font-size:clamp(12px,2.5vh,20px)}.srank{font-size:clamp(10px,1.9vh,13px);padding:2px 8px}
.sc .rhead h1{font-size:clamp(20px,4.4vh,40px)}.sc .rhead,.sbar,.sc .controls{flex-shrink:0}
.sbl{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--r),minmax(0,1fr));grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:4px 12px;max-height:calc(var(--r)*60px);margin:0}
.sbli{min-height:0;overflow:hidden;padding:0 12px;font-size:clamp(11px,2.4vh,19px)}.sbli span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc.fitt{flex:1 1 auto;flex-shrink:1;min-height:0}
.board.fitb{display:flex;flex-direction:column;gap:clamp(6px,1.4vh,12px);padding:clamp(10px,2.2vh,28px) clamp(14px,3vw,36px);flex:1;min-height:0}
.board.fitb h1{font-size:clamp(22px,5.4vh,52px)}.board.fitb .stats,.board.fitb .endbtns{flex-shrink:0}.board.fitb .stats .pill{font-size:clamp(11px,1.9vh,15px)}
.board.fitb .go{margin-top:0;padding:clamp(7px,1.3vh,12px) clamp(18px,2.4vw,30px);font-size:clamp(12px,2vh,16px)}
@media(max-width:600px),(max-height:520px){
.sc{flex:none}.sgrid{flex:none;max-height:none;grid-template-rows:repeat(var(--r),44px)}
.sbl{flex:none;max-height:none;grid-template-rows:repeat(var(--r),36px)}.toc.fitt,.board.fitb{flex:none}.board.fitb{overflow:visible}
.sin{height:34px;font-size:16px}.sn,.stot{font-size:15px}.sbli{font-size:15px}
.sc .controls{position:sticky;bottom:0;z-index:2;background:rgba(8,20,38,.94);padding:6px 0}
.sc .rhead h1{font-size:clamp(18px,5vw,30px)}}
@media(max-width:600px){.sgrid,.sbl{grid-auto-flow:row;grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:44px;display:grid}.sbl{grid-auto-rows:36px}.sc .controls{flex-wrap:wrap}.sc .control{min-width:42%}}
.stp{flex:none;align-self:stretch;min-width:clamp(30px,5.2vh,42px);padding:0;border-radius:6px;background:rgba(255,255,255,.16);color:#fff;border:1px solid var(--border);font:900 clamp(16px,3vh,24px)/1 Arial,sans-serif;display:flex;align-items:center;justify-content:center;-webkit-touch-callout:none;touch-action:manipulation}
.stp:active{background:var(--cyan);color:var(--black)}
.tcl{align-items:stretch;gap:6px}.tcl .stp{height:34px;min-width:38px;align-self:center}.tcl input{align-self:center}
@media(max-width:600px){.sn{width:4em}.sin{width:3.2em}.srow{gap:6px;padding:0 8px}.stp{min-width:38px}.srank{min-width:2.8em;padding:2px 4px}}
</style>

 return `<div class="st"><div class="mt"><span class="pl r">Round ${esc(r.number)}</span><span class="pl y">Question ${String(q.number).padStart(2,'0')}</span><span class="pl">${esc(q.category||'')}</span><span class="mr">${tm.s!=='idle'?obsTmr():''}${as?`<img class="au" src="${as}" alt="">`:''}<span class="pl y">${q.points||0} point${q.points==1?'':'s'}</span></span></div>
 <div class="bd ${im?'':'np'}"><div class="lf"><div class="qr" id="qreg"><div class="q" id="qtxt">${esc(q.question)}</div></div><div class="ar ${revealed?(jr?'pop':''):'v'}" id="areg"><div class="a" id="atxt">${esc(q.answer)}</div>${q.info?`<div class="info">${esc(q.info)}</div>`:''}</div></div>${im}</div></div>`;
}
function obsBtnUpd(){document.getElementById('obsBtn').classList.toggle('hot',!!(obs&&!obs.closed))}
function toggleOBS(){
 obsLast='';
 if(obs&&!obs.closed){obs.close();obs=null;obsScore=null;obsBtnUpd();return}
 obs=window.open('','rumham-obs','popup=yes,width=1280,height=720');
 if(!obs){alert('The OBS window was blocked. Allow pop-ups for this page, then try again.');return}
 const d=obs.document;d.open();d.write('<!DOCTYPE html><meta charset="utf-8"><title>RumHam OBS</title><style>'+OBS_CSS+OBS_CSS2+'</style><div id="stage"></div>');d.close();
 obs.addEventListener('resize',()=>obs.requestAnimationFrame(()=>fitText(obs.document,obs.innerHeight)));
 d.addEventListener('dblclick',()=>{const o=obs.document,el=o.documentElement,on=o.fullscreenElement||o.webkitFullscreenElement;try{on?(o.exitFullscreen||o.webkitExitFullscreen).call(o):(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){}});
 obsBtnUpd();obsSync(false)}
function obsSync(jr){if(!obs)return;if(obs.closed){obs=null;obsBtnUpd();return}
 const st=obs.document.getElementById('stage');if(!st||!quiz)return;
 const h=obsHTML(jr);if(obsScore){if(h===obsLast)return;obsLast=h}else obsLast='';st.innerHTML=h;obs.requestAnimationFrame(()=>fitText(obs.document,obs.innerHeight))}
setInterval(()=>{if(obs&&obs.closed){obs=null;obsBtnUpd()}},1000);
addEventListener('beforeunload',()=>{if(obs&&!obs.closed)obs.close()});
function openImporter(){document.getElementById('importModal').classList.remove('hidden')}
function closeImporter(){document.getElementById('importModal').classList.add('hidden')}
document.getElementById('fileInput').addEventListener('change', async e=>{
 const f=e.target.files[0]; if(!f)return;
 try{const data=JSON.parse(await f.text());loadQuiz(data);saveQuiz(data);closeImporter();e.target.value=''}
 catch(err){alert('Could not read this quiz package. For this first test it must contain JSON quiz data.')}
});
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
const OBS_CSS2=`.sbT{font:calc(var(--u)*92)/1 var(--d);color:#FFD90E;text-transform:uppercase;text-align:center;letter-spacing:.04em;flex-shrink:0;padding-bottom:calc(var(--u)*22)}
.sbG{flex:1;min-height:0;display:grid;grid-auto-flow:column;gap:calc(var(--u)*8) calc(var(--u)*44);align-content:start;overflow:hidden}
.sbR{display:flex;align-items:center;gap:calc(var(--u)*20);padding:0 calc(var(--u)*24);border-radius:calc(var(--u)*14);background:rgba(255,255,255,.1);font:calc(var(--rh)*.6)/1 var(--d);letter-spacing:.03em;min-width:0;animation:sbdrop cubic-bezier(.25,1.35,.5,1) both}
.sbB{flex:none;width:calc(var(--rh)*.86);height:calc(var(--rh)*.86);border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);font-size:.8em}
.g1 .sbB{background:linear-gradient(180deg,#ffe95a,#e0b800);color:#050505}.g2 .sbB{background:linear-gradient(180deg,#f2f5fa,#aeb8c6);color:#050505}.g3 .sbB{background:linear-gradient(180deg,#e9a566,#b36a24);color:#050505}
.g1{box-shadow:inset calc(var(--u)*10) 0 0 #FFD90E}.g2{box-shadow:inset calc(var(--u)*10) 0 0 #d9dfe8}.g3{box-shadow:inset calc(var(--u)*10) 0 0 #cd7f32}
.sbN{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sbP{color:#FFD90E}
.sbR.win{background:linear-gradient(90deg,#ffe95a,#FFD90E 60%,#e0b800);color:#050505;box-shadow:0 0 calc(var(--u)*60) rgba(255,217,14,.8)}.sbR.win .sbP{color:#050505}
@keyframes sbdrop{from{transform:translateY(calc(var(--u)*-1100));opacity:0}15%{opacity:1}to{transform:none;opacity:1}}`;
function standings(up){const rows=[];for(let t=0;t<teams;t++){let v=0;for(let i=0;i<=up;i++){const e=scores[i];if(e&&e.v[t]!=null)v+=+e.v[t]}rows.push({t,s:Math.round(v*100)/100})}
 const srt=[...rows].sort((a,b)=>b.s-a.s||a.t-b.t);let p=0;srt.forEach((x,i)=>{if(i===0||x.s!==srt[i-1].s)p=i+1;x.p=p});return{rows,srt}}
const layoutOf=n=>({r:Math.min(n,15),c:n>15?2:1});
const hasScores=up=>Object.keys(scores).some(k=>+k<=up);
const ord=n=>{const q=['th','st','nd','rd'],v=n%100;return n+(q[(v-20)%10]||q[v]||q[0])};
const obsBoardOn=()=>!!(obsScore&&obs&&!obs.closed);
function fromOf(r){let f=r;while(f>0&&!scores[f-1])f--;return f}
function boardHTML(title,srt,final){
 const n=srt.length,rowsN=Math.min(n,15),cols=n>15?2:1,rh=Math.min(92,Math.floor(760/rowsN)-8),del=new Array(n);
 del[n-1]=0;for(let i=n-2;i>=0;i--)del[i]=del[i+1]+(srt[i].p<=3?1300:140);
 const rows=srt.map((x,i)=>{const top=x.p<=3;return `<div class="sbR ${top?'g'+x.p:''} ${final&&x.p===1?'win':''}" style="animation-delay:${del[i]}ms;animation-duration:${top?900:450}ms"><span class="sbB">${x.p}</span><span class="sbN">Team ${x.t+1}</span><span class="sbP">${x.s}</span></div>`}).join('');
 return `<div class="st"><div class="sbT">${title}</div><div class="sbG" style="--rh:calc(var(--u)*${rh});grid-template-rows:repeat(${rowsN},var(--rh));grid-template-columns:repeat(${cols},1fr)">${rows}</div></div>`}
function openScores(r){scoreR=r==null?roundIndex:r;view='score';au.pause();lastKey='';entered=true;renderRounds();render()}
function afterScores(){if(scoreR<quiz.rounds.length-1)openRound(scoreR+1);else showEnd()}
function backFromScores(){if(scoreR>=quiz.rounds.length){openScores(quiz.rounds.length-1);return}
 roundIndex=scoreR;qIndex=quiz.rounds[scoreR].questions.length-1;revealed=false;view='quiz';renderRounds();render()}
function restartQuiz(){const sc=scores,t=teams;loadQuiz(quiz);scores=sc;teams=t;saveSoon();renderRounds()}
function showScoreObs(final){if(!(obs&&!obs.closed))toggleOBS();if(!obs)return;obsScore={final:!!final};render()}
function hideScoreObs(){obsScore=null;render()}
function setTeams(v){teams=Math.max(1,Math.min(30,Math.round(+v)||teams));saveSoon();renderRounds();render()}
function updScore(){const sd=standings(scoreR),any=hasScores(scoreR);
 sd.rows.forEach(x=>{const row=document.getElementById('sr'+x.t);if(!row)return;row.querySelector('.stot').textContent=any?x.s:'\u2013';const k=row.querySelector('.srank');k.textContent=any?ord(x.p):'';k.className='srank'+(any&&x.p<=3?' r'+x.p:'')})}
function renderScore(){
 const R=quiz.rounds,fin=scoreR>=R.length,r=R[Math.min(scoreR,R.length-1)],ent=scores[scoreR],from=ent?ent.from:fromOf(scoreR),last=scoreR===R.length-1,on=obsBoardOn(),lay=layoutOf(teams);
 const chips=R.map((x,i)=>`<button class="schip ${i===scoreR?'on':''} ${scores[i]?'has':''}" onclick="openScores(${i})" aria-label="Round ${esc(x.number)} scores">R${esc(x.number)}</button>`).join('')+`<button class="schip ${fin?'on':''}" onclick="openScores(${R.length})">Final</button>`;
 const cov=!fin&&from<scoreR?`<span class="pill cov">Covers Rounds ${esc(R[from].number)}\u2013${esc(r.number)}</span>`:'';
 const im=DESK?'decimal':'none';
 const tc=`<div class="tcl">Teams <button type="button" class="stp" data-team="-1" aria-label="Fewer teams">\u2212</button><input id="tcount" type="number" min="1" max="30" inputmode="${DESK?'numeric':'none'}" value="${teams}" onchange="setTeams(this.value)"><button type="button" class="stp" data-team="1" aria-label="More teams">+</button></div>`;
 const obsBtn=(f)=>DESK?`<button class="control reveal" onclick="${on?'hideScoreObs()':'showScoreObs('+f+')'}">${on?'HIDE FROM OBS':f?'SHOW FINAL ON OBS':'SHOW ON OBS'}</button>`:'';
 let h,body,ctl;
 if(fin){
  const any=hasScores(R.length-1);h='Final scores';
  body=any?`<div class="sbl" style="--r:${lay.r};--c:${lay.c}">`+standings(R.length-1).srt.map(x=>`<div class="sbli ${x.p===1?'win':''}"><b>${x.p}</b><span>Team ${x.t+1}</span><em>${x.s}</em></div>`).join('')+'</div>':'<p class="status">No scores entered yet.</p>';
  ctl=`<button class="control" onclick="backFromScores()">\u2190 PREVIOUS</button>${any?obsBtn(true):''}<button class="control primary" onclick="afterScores()">FINISH &#10003;</button>`;
 }else{
  h='Scores after Round '+esc(r.number);
  body=`<div class="sgrid" style="--r:${lay.r};--c:${lay.c}">`+Array.from({length:teams},(_,t)=>{const v=ent&&ent.v[t]!=null?ent.v[t]:'';return `<div class="srow" id="sr${t}"><span class="sn">Team ${t+1}</span><button type="button" class="stp" data-t="${t}" data-d="-1" aria-label="Team ${t+1} minus">\u2212</button><input class="sin" type="text" inputmode="${im}" enterkeyhint="next" autocomplete="off" data-t="${t}" value="${v}" aria-label="Team ${t+1} points"><button type="button" class="stp" data-t="${t}" data-d="1" aria-label="Team ${t+1} plus">+</button><span class="stot"></span><span class="srank"></span></div>`}).join('')+'</div>';
  ctl=`<button class="control" onclick="backFromScores()">\u2190 PREVIOUS</button><button class="control" onclick="afterScores()">SKIP SCORES</button>${obsBtn(false)}<button class="control primary" onclick="afterScores()">${last?'FINISH &#10003;':'NEXT ROUND \u2192'}</button>`;
 }
 document.getElementById('content').innerHTML=`<div class="sc"><div class="rhead"><h1>${h}</h1></div><div class="sbar">${chips}${cov}${tc}</div>${body}<div class="controls">${ctl}</div></div>`;
 if(!fin)updScore()}
(function(){const c=document.getElementById('content');
 c.addEventListener('input',e=>{const el=e.target;if(!el.classList||!el.classList.contains('sin'))return;
  const v=el.value.replace(/[^0-9.\-]/g,'');if(v!==el.value)el.value=v;
  const t=+el.dataset.t;let n=parseFloat(v);if(isNaN(n))n=null;let en=scores[scoreR];
  if(n==null){if(en){en.v[t]=null;if(!en.v.some(x=>x!=null))delete scores[scoreR]}}
  else{if(!en)en=scores[scoreR]={from:fromOf(scoreR),v:Array(30).fill(null)};en.v[t]=n}
  updScore();saveSoon()});
 c.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const el=e.target;
  if(el.id==='tcount'){e.preventDefault();el.blur();return}
  if(!el.classList||!el.classList.contains('sin'))return;e.preventDefault();
  const all=[...c.querySelectorAll('.sin')],nx=all[all.indexOf(el)+1];if(nx){nx.focus();nx.select()}else el.blur()});
})();
function stepScore(t,d){let en=scores[scoreR];const cur=en&&en.v[t]!=null?+en.v[t]:0,n=Math.round((cur+d)*100)/100;
 if(!en)en=scores[scoreR]={from:fromOf(scoreR),v:Array(30).fill(null)};en.v[t]=n;
 const i=document.querySelector('.sin[data-t="'+t+'"]');if(i)i.value=n;updScore();saveSoon()}
let holdT=0,holdI=0;
function stopHold(){clearTimeout(holdT);clearInterval(holdI)}
['pointerup','pointercancel','blur'].forEach(ev=>addEventListener(ev,stopHold));
(function(){const c=document.getElementById('content');
 c.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.stp');if(!b)return;e.preventDefault();stopHold();
  const team=b.dataset.team!=null,d=+(team?b.dataset.team:b.dataset.d),t=+b.dataset.t;let k=0;
  const go=()=>{k++;if(team)setTeams(teams+d);else stepScore(t,d*(k>14?5:1))};
  go();holdT=setTimeout(()=>{holdI=setInterval(go,team?170:85)},400)});
 c.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.stp'))e.preventDefault()});
})();
init();
</script>
</body>
