<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050507}
#st{position:absolute;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;color:#ece8dc;font:600 32px 'Barlow Condensed','Arial Narrow',sans-serif;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><text x='20' y='70' font-size='60' fill='%23ffd21a' fill-opacity='.07'>♪</text><text x='120' y='190' font-size='54' fill='%23ffd21a' fill-opacity='.06'>♫</text></svg>"),radial-gradient(ellipse at 50% -10%,#4a3600 0,#0e0d0a 52%,#050505 100%)}
.bz{font-family:'Lilita One','Bebas Neue',Impact,sans-serif;font-weight:400}
.gold{background:linear-gradient(180deg,#ffe89a,#c9961a);-webkit-background-clip:text;color:transparent}
#top{position:absolute;left:0;right:0;top:0;height:330px;text-align:center}
#lab{margin-top:26px;font:400 38px 'Lilita One','Bebas Neue',Impact,sans-serif;letter-spacing:.3em;color:#f5c542;display:flex;justify-content:center;align-items:center;gap:22px}
.eq{display:flex;gap:5px;align-items:flex-end;height:36px}.eq i{width:7px;height:100%;background:#f5c542;border-radius:2px;transform-origin:bottom;transform:scaleY(.2);animation:eq .9s ease-in-out infinite;animation-play-state:paused}
.eq.on i{animation-play-state:running}.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.25s}
@keyframes eq{50%{transform:scaleY(1)}}
#tt{margin-top:18px;padding:0 300px}
.pt{font:400 118px/1.02 'Lilita One','Bebas Neue',Impact,sans-serif;background:linear-gradient(180deg,#ffe89a,#c9961a);-webkit-background-clip:text;color:transparent;overflow-wrap:anywhere}
.pt.s{font-size:84px}.pt.xs{font-size:58px}.pa{font-size:58px;color:#5fe0f2;margin-top:10px}
.tl{display:flex;flex-wrap:wrap;justify-content:center;gap:0 calc(var(--w)*.55)}.wd{display:flex;gap:7px;margin:6px 0}
.tl b{width:var(--w);height:calc(var(--w)*1.22);font:400 calc(var(--w)*.86)/calc(var(--w)*1.22) 'Lilita One','Bebas Neue',Impact,sans-serif;text-align:center;color:#14110a;border-radius:9px;background:linear-gradient(180deg,#ffe27a,#d1a021);box-shadow:0 5px 0 #8a6a12,0 10px 24px rgba(0,0,0,.5)}
.tl.ar{margin-top:12px}.tl.ar b{background:linear-gradient(180deg,#9df3ff,#1fa6c0);box-shadow:0 4px 0 #0f6173,0 8px 20px rgba(0,0,0,.5)}.tl.ar b.ok{background:linear-gradient(180deg,#e6fcff,#5fe0f2);box-shadow:0 0 26px rgba(95,224,242,.7),0 4px 0 #0f6173}
.tl b.fl{animation:flip .5s ease-in-out}.tl b.ok{background:linear-gradient(180deg,#fff7d6,#f5c542);box-shadow:0 0 28px rgba(245,197,66,.7),0 5px 0 #8a6a12}
@keyframes flip{50%{transform:rotateX(90deg)}}
#mid{position:absolute;left:120px;right:120px;top:340px;height:540px}
#mid h2{font:400 34px 'Lilita One','Bebas Neue',Impact,sans-serif;letter-spacing:.22em;color:#9a96a8;margin-bottom:10px;display:flex;gap:20px;align-items:center}
#mid h2:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,#c9961a,transparent)}
#lw{height:480px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 6%,#000 92%,transparent);mask-image:linear-gradient(transparent,#000 6%,#000 92%,transparent)}
#ul{list-style:none}
@keyframes sc{to{transform:translateY(-50%)}}
#ul li{display:flex;gap:18px;align-items:center;height:60px;border-bottom:1px solid #26262f;padding:0 6px}
#ul li b{flex:none;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 24px 'Lilita One',Arial,sans-serif;color:#111;background:radial-gradient(circle at 32% 28%,#fff 0 55%,#d9d2b8 100%);border:3px solid #000;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
#ul li span{display:flex;gap:30px;align-items:baseline;line-height:1;min-width:0}#ul li em{font-style:normal;font-weight:700;font-size:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
#ul li small{font-size:36px;color:#5fe0f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
#ul li.new{animation:nw 2.5s ease-out}@keyframes nw{from{background:rgba(245,197,66,.35);transform:translateX(-30px);opacity:0}30%{opacity:1;transform:none}}
.none{color:#6d6a78;font-size:40px;padding-top:30px}
#bot{position:absolute;left:0;right:0;top:900px;height:180px;border-top:6px solid #ffd21a;box-shadow:0 -10px 30px rgba(255,210,26,.12);background:rgba(0,0,0,.35);display:flex;align-items:center;padding:0 80px;gap:30px}
#qr{background:#fff;padding:8px;border-radius:8px;width:156px;height:156px}#qr img,#qr canvas{display:block}
.k{font-size:28px;color:#9a96a8;letter-spacing:.1em}.v{font:400 78px/1 'Lilita One','Bebas Neue',Impact,sans-serif;color:#f5c542}
#bz{flex:1;text-align:center}#bp{text-align:right}#pay{display:none;align-items:center;gap:20px}#pay .k,#pay .v{text-align:right}#qp{background:#fff;padding:8px;border-radius:8px;width:156px;height:156px}#qp img,#qp canvas{display:block}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;background:rgba(5,5,8,.94);z-index:5}
#ov.win{background:radial-gradient(circle,#4a3a0c,#0b0a0e 70%)}
#ov h1{font:400 200px/1 'Lilita One','Bebas Neue',Impact,sans-serif;background:linear-gradient(180deg,#ffe89a,#c9961a);-webkit-background-clip:text;color:transparent}#ov h1.m{font-size:140px;max-width:1760px;overflow-wrap:anywhere}
#ov h3{font:400 90px 'Lilita One','Bebas Neue',Impact,sans-serif;color:#f5c542;letter-spacing:.06em}#ov p{font-size:46px;color:#9a96a8}
#ov ol{list-style:none;font-size:52px;font-weight:700}#ov ol li{padding:6px 0}#ov ol em{font-style:normal;color:#f5c542}
.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.4);opacity:0}}
.cf{position:absolute;inset:0;overflow:hidden;pointer-events:none}.cf i{position:absolute;top:-60px;width:16px;height:30px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(1200px) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
#logo{position:absolute;left:34px;top:10px;height:218px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.7))}
#rib{position:absolute;left:20px;top:238px;width:250px;text-align:center;white-space:nowrap;font:400 38px 'Lilita One',Impact,sans-serif;color:#ffd21a;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000;letter-spacing:.04em;transform:rotate(-3deg)}
#vinyl{position:absolute;right:56px;top:46px;width:230px;height:230px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 3px,#1d1d1d 3px 6px);border:6px solid #000;box-shadow:0 10px 24px rgba(0,0,0,.7)}
#vinyl:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(255,255,255,.16),transparent 20%,transparent 50%,rgba(255,255,255,.16) 70%,transparent 90%)}
#vinyl i{position:absolute;inset:78px;border-radius:50%;background:#ffd21a;border:5px solid #000}#vinyl i:after{content:"";position:absolute;inset:34px;border-radius:50%;background:#000}
#vinyl.on{animation:spin 3.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ovlogo{height:230px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.7))}
.bb{display:flex;gap:26px;justify-content:center}.bb span{width:190px;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 120px 'Lilita One',Arial,sans-serif;color:#fff;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 10%,transparent 11%),var(--bc);border:6px solid #000;box-shadow:0 8px 0 #000;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:hop 1s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-30px)}}
#ov.split{flex-direction:row;gap:70px;padding:0 90px}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;width:940px}
#ov.split h1.m{font-size:104px}#ov.split .ovlogo{height:170px}#ov.split .bb{gap:16px}#ov.split .bb span{width:150px;height:150px;font-size:96px}
#ov h1.bad{background:linear-gradient(180deg,#ff9a9a,#e63946);-webkit-background-clip:text;color:transparent}#ov h3.okc{color:#2ecc71;font-size:68px}
.ocard{display:grid;grid-template-columns:repeat(5,134px);gap:8px;flex:none}
.oc{width:134px;height:134px;padding:6px;border-radius:12px;background:#fff6d6;color:#111;border:4px solid #000;box-shadow:0 5px 0 #000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05;overflow:hidden}
.oc b{font:700 23px 'Barlow Condensed','Arial Narrow',sans-serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.oc i{font:600 17px 'Barlow Condensed','Arial Narrow',sans-serif;opacity:.65;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc.m{background:#ffd21a}.oc.ok{background:#35c46b;color:#04210f}.oc.bad{background:#ff5d5d;color:#2a0505}
#pg:empty{display:none}
.mg{display:inline-grid;grid-template-columns:repeat(5,18px);gap:3px;vertical-align:middle;margin-left:10px}.mg i{width:18px;height:18px;border-radius:3px;background:#3a3a3a}.mg i.on{background:#ffd21a}.mg i.alt{background:#7a6410}
.mg i{transition:background .3s}
</style>

const psCache = {};
function patSets(k, t) {   // every shape worth showing for this prize; the little grid cycles through them
  t = ALLOWED[t] ? t : 'h'; const key = k + t;
  if (psCache[key]) return psCache[key];
  let out;

  else {   // k lines: any k of the 12 lines. For two or more, show an evenly spread sample of the combinations
    const ids = ALLOWED[t], all = [], pick = (from, got) => { if (got.length === k) { all.push([...new Set(got.flatMap(i => LN[i]))]); return; } for (let i = from; i < ids.length; i++) pick(i + 1, got.concat(ids[i])); };

function tone(seq) {   // synthesized sounds, like the other RumHam overlays
  if (!ctx) return;
  try { ctx.resume(); let t = ctx.currentTime;

}

function drawTop() {

  if (D.mode === 'hidden') { tt.innerHTML = '<div class="pt">Name that tune</div>'; return; }
  if (D.mode === 'plain') { tt.innerHTML = `<div class="pt${c.t.length > 34 ? ' xs' : c.t.length > 20 ? ' s' : ''}">${esc(c.t)}</div>${c.a ? `<div class="pa">${esc(c.a)}</div>` : ''}`; return; }
  if (!D.reveal) { tt.innerHTML = tiles(c.scr, 96) + (c.a && c.sa ? tiles(c.sa, 60, 'ar') : ''); return; }
  if (sameSong && wasRev === false) {   // unscramble: flip every tile (track row, then artist row) into its real letter
    const rows = [...tt.querySelectorAll('.tl')], reals = [c.t, c.a].filter(Boolean).map(x => [...x.toUpperCase().replace(/\s/g, '')]);

function drawList() {

  if (key === k.list) return;
