<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RumHam Quiz - Play</title>
<style>
:root{--navy:#0b1f4d;--ink:#050505;--yellow:#FFD90E;--cyan:#20C7D9;--soft:#b9c6da;--green:#2ecc71;--red:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#07142e;overscroll-behavior:none}
body{background:radial-gradient(circle at 50% -10%,#1b3f86 0,#0b1f4d 45%,#060d22 100%);min-height:100%}
#app{min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{width:100%;max-width:480px;margin:0 auto;padding:22px 18px;display:flex;flex-direction:column;gap:10px}
h1{margin:10px 0 6px;color:var(--yellow);text-transform:uppercase;font-size:28px;letter-spacing:.03em;text-align:center}
label{font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan);margin-top:6px}
input{font:900 22px Arial,sans-serif;padding:14px;border-radius:12px;border:3px solid transparent;background:#fff;color:var(--ink);width:100%;text-transform:none}
input:focus{outline:0;border-color:var(--cyan)}
#rc{text-transform:uppercase;letter-spacing:.2em;text-align:center}
button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}
.big{margin-top:12px;padding:16px;border-radius:14px;background:var(--yellow);color:var(--ink);font-weight:900;font-size:20px;letter-spacing:.05em;box-shadow:0 5px 0 #b89c00}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b89c00}
.err{color:var(--red);font-weight:700;min-height:1.4em;text-align:center;margin:4px 0}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:rgba(0,0,0,.35);border-bottom:2px solid rgba(255,255,255,.12)}
.tn{font-weight:900;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tot{font-weight:900;color:var(--yellow);white-space:nowrap}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px;width:100%;max-width:520px;margin:0 auto;text-align:center}
.prompt{font-weight:900;font-size:18px;color:var(--soft)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}
.k{aspect-ratio:1;border-radius:12px;background:linear-gradient(180deg,#2a5bb8,#173f78);color:#fff;font-weight:900;font-size:clamp(20px,6.4vw,30px);box-shadow:0 4px 0 #0a2250}
.k:active{background:var(--yellow);color:var(--ink);transform:translateY(3px);box-shadow:0 1px 0 #0a2250}
.lock{width:min(56vw,230px);aspect-ratio:1;border-radius:50%;background:var(--yellow);color:var(--ink);display:flex;align-items:center;justify-content:center;font:900 clamp(90px,34vw,150px)/1 Arial,sans-serif;box-shadow:0 0 50px rgba(255,217,14,.5)}
.lock.x{background:rgba(255,255,255,.12);color:#fff;font-size:70px;box-shadow:none}
.cap{font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);font-size:20px}
.sub{color:var(--soft);font-weight:700}
.ans b{display:block;font-size:clamp(60px,22vw,110px);color:var(--yellow);line-height:1.05}
.ans{font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.res{font-weight:900;font-size:30px;padding:10px 20px;border-radius:14px}
.res.ok{background:rgba(46,204,113,.2);color:var(--green)}.res.bad{background:rgba(255,93,93,.18);color:var(--red)}.res.none{background:rgba(255,255,255,.1);color:var(--soft)}
.bonus{font-weight:900;color:var(--yellow);font-size:22px}
.fast{list-style:none;margin:0;padding:0;font-weight:800;color:var(--soft)}.fast li{padding:2px 0}.fast b{color:#fff}
.foot{padding:10px 16px;text-align:center}
.foot button{background:none;color:var(--soft);text-decoration:underline;font-size:13px;padding:8px}
#net{position:fixed;left:0;right:0;top:0;background:var(--red);color:#fff;text-align:center;font-weight:900;font-size:13px;padding:4px;display:none;z-index:9}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;display:none;z-index:9}
</style>
</head>
<body>
<div id="net">Reconnecting&hellip;</div>
<div id="toast"></div>
<div id="app"></div>
<script>
/* ---- Paste your Supabase details here (Project settings > API) ---- */
const CFG = {
  url: 'https://fgsbfspzktxrwdyvhldc.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnc2Jmc3B6a3R4cndkeXZobGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzI1MTcsImV4cCI6MjEwNzIwODUxN30.ns574hMPQ5nkQUnpirmrrTYhN6MwH1YFR4qhlp6EddI'
};
/* ------------------------------------------------------------------- */

const Q = new URLSearchParams(location.search);
const SB_URL = (Q.get('u') || CFG.url || '').replace(/\/$/, ''), SB_KEY = Q.get('k') || CFG.key || '';
const $ = id => document.getElementById(id), app = $('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function rpc(fn, args) {
  const h = { apikey: SB_KEY, 'Content-Type': 'application/json' };
  if (SB_KEY.startsWith('eyJ')) h.Authorization = 'Bearer ' + SB_KEY;
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: h, body: JSON.stringify(args) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || 'Connection problem (' + r.status + ')');
  return j;
}

let me = null, timer = 0, errs = 0, sig = '', lastS = null, pend = null, pendQ = null;
try { me = JSON.parse(localStorage.getItem('rh_team') || 'null'); } catch (e) {}
const wantRoom = (Q.get('r') || '').toUpperCase();
if (me && wantRoom && me.room !== wantRoom) me = null;
const saveMe = () => { try { me ? localStorage.setItem('rh_team', JSON.stringify(me)) : localStorage.removeItem('rh_team'); } catch (e) {} };
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2600); }

function joinView(msg) {
  clearTimeout(timer); sig = '';
  app.innerHTML = `<div class="wrap"><h1>Join the quiz</h1>
    <label for="rc">Room code</label><input id="rc" maxlength="8" autocapitalize="characters" autocomplete="off" value="${esc(wantRoom)}">
    <label for="tn">Team name</label><input id="tn" maxlength="24" autocomplete="off">
    <button class="big" id="jb">JOIN</button><p class="err" id="je">${esc(msg || '')}</p></div>`;
  const go = async () => {
    const room = $('rc').value.trim().toUpperCase(), name = $('tn').value.trim();
    $('je').textContent = ''; $('jb').disabled = true;
    try {
      const r = await rpc('join_team', { p_room: room, p_name: name });
      me = { room, id: r.id, secret: r.secret, name: r.name }; saveMe(); start();
    } catch (e) { $('je').textContent = e.message; $('jb').disabled = false; }
  };
  $('jb').onclick = go;
  app.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go(); });
}

function start() { sig = ''; pend = null; pendQ = null; poll(); }
async function poll() {
  clearTimeout(timer);
  if (!me) return;
  try {
    const s = await rpc('get_state', { p_room: me.room, p_team: me.id, p_secret: me.secret });
    errs = 0; $('net').style.display = 'none'; draw(s);
  } catch (e) {
    if (/Room not found/.test(e.message)) { me = null; saveMe(); joinView('That room has ended. Enter a new code.'); return; }
    if (++errs > 2) $('net').style.display = 'block';
  }
  timer = setTimeout(poll, 1000);
}

function keypad() {
  return `<div class="prompt">Tap the first letter of the answer</div><div class="pad">` +
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l => `<button class="k" data-l="${l}">${l}</button>`).join('') + '</div>';
}

function draw(s) {
  lastS = s;
  const m = s.me || {};
  if (m.valid === false) { me = null; saveMe(); joinView('You are no longer in this room. Join again.'); return; }
  if (pendQ !== null && pendQ !== s.qkey) { pend = null; pendQ = null; }
  const L = m.letter || (pendQ === s.qkey ? pend : null);
  const key = [s.state, s.qkey, L, m.ok, m.points, m.bonus, m.total, m.rank, m.ms].join('|');
  if (key === sig) return; sig = key;

  let body;
  const secs = m.ms != null ? (m.ms / 1000).toFixed(2) + 's' : '';
  if (s.state === 'open') {
    body = L ? `<div class="lock">${esc(L)}</div><div class="cap">Locked in</div><div class="sub">${secs ? 'Answered in ' + secs : 'Sending&hellip;'}</div>` : keypad();
  } else if (s.state === 'closed') {
    body = L ? `<div class="lock">${esc(L)}</div><div class="cap">Locked in</div><div class="sub">Waiting for the answer&hellip;</div>`
             : `<div class="lock x">&#9201;</div><div class="cap">Time's up</div><div class="sub">No answer from you</div>`;
  } else if (s.state === 'revealed') {
    const ans = (s.correct || []).join(' / ') || '?';
    let res;
    if (!m.letter) res = `<div class="res none">No answer</div>`;
    else if (m.ok) res = `<div class="res ok">&#10003; Correct +${m.points}</div>` + (m.bonus ? `<div class="bonus">Includes +${m.bonus} speed bonus!</div>` : '') + (secs ? `<div class="sub">${secs}</div>` : '');
    else res = `<div class="res bad">&#10007; You chose ${esc(m.letter)}</div>`;
    const f = (s.fastest || []).map(x => `<li><b>${esc(x.name)}</b> +${x.bonus}</li>`).join('');
    body = `<div class="ans">The answer is<b>${esc(ans)}</b></div>${res}${f ? `<div class="cap">Fastest</div><ul class="fast">${f}</ul>` : ''}`;
  } else {
    body = `<div class="lock x">&hellip;</div><div class="cap">Get ready</div><div class="sub">Waiting for the next question</div>`;
  }
  app.innerHTML = `<header><span class="tn">${esc(me.name)}</span><span class="tot">${m.total || 0} pts &middot; #${m.rank || '-'}</span></header>
    <div class="main">${body}</div><div class="foot"><button id="lv">Not your team? Leave</button></div>`;
}

app.addEventListener('click', e => {
  const k = e.target.closest && e.target.closest('.k');
  if (k) { tap(k.dataset.l); return; }
  if (e.target.id === 'lv' && confirm('Leave this team?')) { me = null; saveMe(); joinView(''); }
});

function tap(l) {
  if (pend || !lastS || lastS.state !== 'open') return;
  pend = l; pendQ = lastS.qkey; sig = ''; draw(lastS);
  if (navigator.vibrate) navigator.vibrate(25);
  rpc('submit_answer', { p_room: me.room, p_team: me.id, p_secret: me.secret, p_letter: l })
    .then(r => { if (r && r.letter) pend = r.letter; sig = ''; poll(); })
    .catch(e => { pend = null; pendQ = null; sig = ''; toast(e.message); poll(); });
}

if (!SB_URL || !SB_KEY) app.innerHTML = '<div class="wrap"><h1>Not set up</h1><p class="err">Add the Supabase URL and key to the top of this file.</p></div>';
else if (me) start();
else joinView('');
</script>
</body>
</html>
